# Deployed on the shared VPS behind the host's own Nginx (one shared reverse
# proxy for every project on the box) — this repo's container only needs to
# publish its API port to 127.0.0.1, TLS/domain routing is handled outside
# this compose file. The bundled `nginx`/80/443 service from earlier revisions
# was removed for that reason; standing up a second Nginx here would just
# collide with the host's.
services:
  rapscos-ayurvedic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rapscos-ayurvedic
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/rapscos.db
      - JWT_EXPIRATION_DAYS=30
      - MEDIA_DIR=/app/media
    volumes:
      - ./data:/app/data
      - ./media:/app/media
    ports:
      - "127.0.0.1:8094:8777"
