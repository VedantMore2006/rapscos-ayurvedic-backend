services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rapscos_api
    restart: always
    environment:
      - DATABASE_URL=sqlite:////app/data/rapscos.db
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_DAYS=30
      - MIN_AUTH_MS=700
      - ADMIN_INVITE_CODE=${ADMIN_INVITE_CODE}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://www.rapscosbio.com,https://rapscosbio.com,http://localhost:5173}
      - MEDIA_DIR=/app/media
    volumes:
      - ./data:/app/data
      - ./media:/app/media
    ports:
      - "8777:8777"

  nginx:
    image: nginx:alpine
    container_name: rapscos_nginx
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./media:/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
